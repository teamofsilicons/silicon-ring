[package]
name = "silicon-ring-cli"
description = "Silicon Ring CLI for silicons"
# Its own version: the CLI ships to silicons on Silicon Apps on its own schedule.
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "ring"
path = "src/main.rs"

[dependencies]
ring-proto.workspace = true
ring-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
url.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt", "macros", "signal", "io-std", "io-util", "time", "process", "fs"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
