[package]
name = "ring-cli"
version = "0.1.1"
edition = "2021"
description = "Silicon Ring command line and persistent local audio daemon"
license = "MIT"

[[bin]]
name = "ring"
path = "src/main.rs"

[dependencies]
ring-client = { path = "../ring-client" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.16"
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
self-replace = "1.5"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
