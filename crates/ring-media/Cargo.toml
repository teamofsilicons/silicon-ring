[package]
name = "silicon-ring-media"
description = "Silicon Ring media worker (LiveKit representatives, recorder, voicemail, STT)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "ring-media"
path = "src/main.rs"

[dependencies]
ring-proto.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
livekit.workspace = true
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "http2"] }
aws-config = { version = "1.12", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1.152", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
base64 = "0.22"
sha2 = "0.10"
anyhow = "1"
uuid.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
