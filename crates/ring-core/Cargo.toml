[package]
name = "silicon-ring-core"
description = "Silicon Ring client SDK: HTTP API, realtime events and (feature `media`) LiveKit call audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "ring_core"

[features]
default = []
# LiveKit call media (libwebrtc). Off for the CLI so it stays a small static binary.
media = ["dep:livekit"]

[dependencies]
ring-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "http2"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
livekit = { workspace = true, optional = true }
