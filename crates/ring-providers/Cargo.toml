[package]
name = "ring-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]

[dependencies]
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
silicon-iam-client = "=5.1.0"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
uuid = { version = "1", features = ["serde"] }
space-station = "0.2"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread", "fs", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
aws-config = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process"] }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }

[dev-dependencies]
dotenvy = "0.15"
