[package]
name = "silicon-ring-server"
description = "Silicon Ring control plane (HTTP API, realtime, calls, push, Ting)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "ring-server"
path = "src/main.rs"

[dependencies]
ring-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
livekit-api.workspace = true

axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "ws"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors", "fs", "limit", "set-header"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "form"] }
rusqlite = { version = "0.38", features = ["bundled"] }
silicon-accounts-client = "0.6"
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
base64 = "0.22"
hex = "0.4"
rand = "0.9"
subtle = "2"
