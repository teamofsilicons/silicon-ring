[package]
name = "silicon-ring-ffi"
description = "C ABI over ring-core call media for native Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "ring_ffi"
# ring_ffi.dll for the Windows app; the rlib keeps `cargo check`/clippy usable from the workspace.
crate-type = ["cdylib", "rlib"]

[dependencies]
ring-core = { workspace = true, features = ["media"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
