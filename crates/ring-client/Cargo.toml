[package]
name = "ring-client"
version = "0.1.5"
edition = "2021"
description = "Reusable authenticated Silicon Ring WebSocket client"
license = "MIT"

[dependencies]
base64 = "0.22"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

