[package]
name = "silicon-ring-native"
version = "0.1.5"
description = "Native Silicon Ring phone"
authors = ["Team of Silicons"]
edition = "2021"

[lib]
name = "silicon_ring_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-call-service = { path = "call-service" }
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-opener = "2.7.0"
serde_json = "1"

# Xcode 27 hides SwiftRs runtime exports in release archives; remove after
# https://github.com/Brendonovich/swift-rs/pull/80 ships in a crates.io release.
[patch.crates-io]
swift-rs = { git = "https://github.com/alchaplinsky/swift-rs", rev = "aaf38d45ab3a4b10a5af3a3dbc64424e998fae8c" }

[workspace]
