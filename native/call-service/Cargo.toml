[package]
name = "tauri-plugin-call-service"
version = "0.1.0"
authors = ["Team of Silicons"]
description = "Native mobile calling and microphone transport for Silicon Ring"
edition = "2021"
links = "tauri-plugin-call-service"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
