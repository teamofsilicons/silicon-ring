name: Linux app

# Builds the GTK4/libadwaita app (linux/) on native x86_64 and aarch64 runners, starts it
# headless once, and packages a .deb and an AppImage per architecture. Nothing is signed or
# released here; the artifacts are for testing and for a release job.

on:
  workflow_dispatch:
  push:
    branches: [rebuild-v1, main]
    paths:
      - "linux/**"
      - "crates/**"
      - "assets/**"
      - ".github/workflows/linux.yml"

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/linux
  # libwebrtc ships Chromium's hermetic libc++, which webrtc-sys only accepts from a recent clang.
  LLVM_VERSION: "21"
  LINUXDEPLOY_TAG: 1-alpha-20251107-1
  LINUXDEPLOY_GTK_COMMIT: 7a3fbc31a9e5075073ff8790f26effbac5f84453
  APPIMAGETOOL_TAG: "1.9.1"

jobs:
  build:
    name: Ring for Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Install GTK, libadwaita and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev libadwaita-1-dev libglib2.0-dev libglib2.0-bin libdbus-1-dev \
            libpulse-dev libasound2-dev \
            libx11-dev libxext-dev libxfixes-dev libxdamage-dev libxrandr-dev libxcomposite-dev libdrm-dev libgbm-dev \
            dpkg-dev file patchelf desktop-file-utils appstream libgdk-pixbuf2.0-bin librsvg2-common \
            xvfb xauth dbus-x11 pulseaudio pulseaudio-utils libgtk-4-media-gstreamer gstreamer1.0-plugins-good

      - name: Install clang ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-${LLVM_VERSION} lld-${LLVM_VERSION}
          # linux/.cargo/config.toml links with `clang -fuse-ld=lld`; webrtc-sys compiles with clang++.
          sudo ln -sf /usr/bin/clang-${LLVM_VERSION} /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${LLVM_VERSION} /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-${LLVM_VERSION} /usr/local/bin/ld.lld
          echo "CC=clang-${LLVM_VERSION}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@1.98

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "linux -> ../target/linux"
          key: linux-${{ matrix.arch }}

      - name: Build
        working-directory: linux
        run: cargo build --release --locked

      - name: Start the app headless
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          "$CARGO_TARGET_DIR/release/ring-desktop" --version
          # Opens libwebrtc's audio device module against a PulseAudio with a virtual speaker and
          # microphone (runners have no sound card).
          pulseaudio --daemonize --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=speakers sink_properties=device.description=Speakers
          pactl load-module module-null-sink sink_name=mic_bus sink_properties=device.description=Microphone-Bus
          pactl load-module module-remap-source source_name=mic master=mic_bus.monitor source_properties=device.description=Microphone
          "$CARGO_TARGET_DIR/release/ring-desktop" --audio-devices
          # No server is reachable here, so the app stops at its connecting/sign-in screen.
          RING_API_URL=http://127.0.0.1:9 RUST_LOG=info timeout 15 \
            xvfb-run -a dbus-run-session -- "$CARGO_TARGET_DIR/release/ring-desktop" > app.log 2>&1 || status=$?
          cat app.log
          [ "${status:-0}" = 124 ] || { echo "ring-desktop exited early (status ${status:-0})"; exit 1; }
          if grep -q "panicked" app.log; then echo "ring-desktop panicked"; exit 1; fi

      - name: Validate the desktop entry and AppStream metadata
        run: |
          desktop-file-validate linux/data/com.teamofsilicons.Ring.desktop
          appstreamcli validate --no-net --explain linux/data/com.teamofsilicons.Ring.metainfo.xml

      - name: Fetch AppImage tools
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSLo "$tools/linuxdeploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_TAG}/linuxdeploy-${{ matrix.arch }}.AppImage"
          curl -fsSLo "$tools/linuxdeploy-plugin-gtk.sh" \
            "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/${LINUXDEPLOY_GTK_COMMIT}/linuxdeploy-plugin-gtk.sh"
          curl -fsSLo "$tools/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_TAG}/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x "$tools"/*
          echo "LINUXDEPLOY=$tools/linuxdeploy" >> "$GITHUB_ENV"
          echo "LINUXDEPLOY_PLUGIN_GTK=$tools/linuxdeploy-plugin-gtk.sh" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$tools/appimagetool" >> "$GITHUB_ENV"

      - name: Package .deb and AppImage
        env:
          REQUIRE_APPIMAGE: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: linux/package.sh --no-build

      - name: Inspect the packages
        run: |
          dpkg-deb --info linux/dist/*.deb
          dpkg-deb --contents linux/dist/*.deb
          file linux/dist/*.AppImage

      - name: Start the AppImage headless
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home-appimage" XDG_RUNTIME_DIR="$RUNNER_TEMP/run-appimage"
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          image="$(ls linux/dist/*.AppImage)"
          "$image" --version
          RING_API_URL=http://127.0.0.1:9 timeout 20 \
            xvfb-run -a dbus-run-session -- "$image" > appimage.log 2>&1 || status=$?
          cat appimage.log
          [ "${status:-0}" = 124 ] || { echo "the AppImage exited early (status ${status:-0})"; exit 1; }
          if grep -qE "panicked|Gtk-ERROR" appimage.log; then echo "the AppImage failed"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: ring-linux-${{ matrix.arch }}
          path: |
            linux/dist/*.deb
            linux/dist/*.AppImage
          if-no-files-found: error
