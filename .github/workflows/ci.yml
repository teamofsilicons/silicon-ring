name: CI

# Format, lint and type-check the Rust workspace on Linux and macOS, and lint and build the web
# app. The project has no test suite; correctness is checked by building and running for real.

on:
  push:
    branches: [main, rebuild-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Install clang 21 and GLib headers (webrtc-sys)
        if: runner.os == 'Linux'
        run: |
          # libwebrtc ships Chromium's hermetic libc++, which webrtc-sys only accepts from clang 21+.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 libglib2.0-dev pkg-config
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build the static export
        run: |
          npm run build
          test -f out/index.html

  scripts:
    name: Deploy and build scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Shell scripts
        run: shellcheck deploy/*.sh scripts/*.sh

      - name: Python scripts
        run: python3 -m py_compile deploy/*.py scripts/*.py
