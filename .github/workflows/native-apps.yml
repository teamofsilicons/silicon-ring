name: Native apps
on:
  push:
    branches: [main]
    paths: ['web/**', 'native/**', '.github/workflows/native-apps.yml']
  pull_request:
    paths: ['web/**', 'native/**', '.github/workflows/native-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: App ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux, arch: x86_64}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: aarch64}
          - {runner: macos-15-intel, platform: macos, arch: x86_64}
          - {runner: macos-15, platform: macos, arch: aarch64}
          - {runner: windows-2025, platform: windows, arch: x86_64}
          - {runner: windows-11-arm, platform: windows, arch: aarch64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: 'native -> target'}
      - name: Linux WebKit and tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Test frontend protocol and PCM framing
        run: npm test --prefix web
      - name: Build installable native app
        working-directory: native
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: node ../web/node_modules/@tauri-apps/cli/tauri.js build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: silicon-ring-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            native/target/release/bundle/**/*.dmg
            native/target/release/bundle/**/*.deb
            native/target/release/bundle/**/*.rpm
            native/target/release/bundle/**/*.AppImage
            native/target/release/bundle/**/*.msi
            native/target/release/bundle/**/*.exe
          if-no-files-found: error
  android:
    name: Android arm64 APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: aarch64-linux-android}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: 'native -> target'}
      - name: Install SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Initialize Android project if absent
        working-directory: native
        run: |
          if [ ! -f gen/android/gradlew ]; then
            node ../web/node_modules/@tauri-apps/cli/tauri.js android init --ci --skip-targets-install
          fi
      - name: Configure Android push when available
        env:
          RING_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.RING_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PYCONFIG'
          import json, os, pathlib
          raw = os.environ.get('RING_ANDROID_GOOGLE_SERVICES_JSON', '')
          if raw:
              config = json.loads(raw)
              config['client'] = [client for client in config['client'] if client['client_info']['android_client_info']['package_name'] == 'com.teamofsilicons.ring']
              assert len(config['client']) == 1, 'Exactly one Ring Android client is required'
              destination = pathlib.Path('native/gen/android/app/google-services.json')
              destination.write_text(json.dumps(config))
              destination.chmod(0o600)
              print('Ring Android push configuration installed')
          else:
              print('Android push configuration unavailable; building without FCM registration')
          PYCONFIG
      - name: Build signed development APK
        working-directory: native
        run: node ../web/node_modules/@tauri-apps/cli/tauri.js android build --debug --target aarch64 --apk --ci
      - uses: actions/upload-artifact@v4
        with:
          name: silicon-ring-android-aarch64-debug
          path: native/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
  ios:
    name: iOS arm64 simulator app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: aarch64-apple-ios-sim, components: llvm-tools}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: 'native -> target'}
      - name: Install iOS build dependencies
        run: brew install xcodegen cocoapods
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Build simulator application
        working-directory: native
        run: node ../web/node_modules/@tauri-apps/cli/tauri.js ios build --debug --target aarch64-sim --no-sign --ci
      - name: Package simulator app
        shell: bash
        run: |
          app=$(find native/gen/apple/build -name '*.app' -type d -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" silicon-ring-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: silicon-ring-ios-aarch64-simulator
          path: silicon-ring-ios-simulator.zip
          if-no-files-found: error
