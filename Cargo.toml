[workspace]
resolver = "3"
members = [
    "crates/ring-proto",
    "crates/ring-core",
    "crates/ring-server",
    "crates/ring-media",
    "crates/ring-cli",
    "crates/ring-ffi",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/teamofsilicons/silicon-ring"
homepage = "https://ring.teamofsilicons.com"

[workspace.dependencies]
ring-proto = { package = "silicon-ring-proto", path = "crates/ring-proto", version = "1.0.0" }
ring-core = { package = "silicon-ring-core", path = "crates/ring-core", version = "1.0.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
livekit = { version = "=0.9.5", features = ["rustls-tls-webpki-roots"] }
livekit-api = { version = "=0.9.0", default-features = false, features = ["services", "access-token", "webhooks", "rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
